# RMF Sample Docker Pipeline — GitHub Actions
# Purpose: prove Docker Hub build/push mechanics work with a trivial sample
# app before relying on the real multi-image docker-build-pipeline.yml.

name: RMF Sample Docker Pipeline

on:
  push:
    branches: [main]
    paths:
      - "sample-app/**"
  pull_request:
    branches: [main]
    paths:
      - "sample-app/**"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/rmf-sample-test

jobs:
  validate:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: sample-app/Dockerfile
          failure-threshold: error

  build-and-push:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sample-app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
