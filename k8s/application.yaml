apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rmf-core
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vishalbalajee/Changi-rmf-dock.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: rmf

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
